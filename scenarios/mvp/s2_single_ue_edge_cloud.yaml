  - {id: inference-http-flow, ue_id: ue-1, session_id: cloud-session, service_instance_id: inference-cloud, protocol: http, src_port: 41003, dst_port: 8080, rate_mbps: 5, packet_size_bytes: 1200, sla: {latency_ms: 80, jitter_ms: 10, loss_rate: 0.005, bandwidth_ul_mbps: 0.25, bandwidth_dl_mbps: 5, guaranteed_bandwidth_ul_mbps: 0.1, guaranteed_bandwidth_dl_mbps: 2, priority: 8}, allocation: {allocated_bandwidth_ul_mbps: 0.25, allocated_bandwidth_dl_mbps: 5}}
mobility: []
